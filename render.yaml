services:
  - type: web
    name: suggest-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node api/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false   # Set this in the Render dashboard (your Neon/Postgres connection string)
      - key: JWT_SECRET
        sync: false   # Set this in the Render dashboard
      - key: PORT
        value: 10000
